<span/><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>अनुदान</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p><span style="display:inline-block; text-align:center; width:100% ;">(१)</span><br/>
मुखरित दिलको धुईरो गुन्जन<br/>
आँत भरीको जलको गुन्‌गुन<br/>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 3em;">शान्त, अँध्यारो कुनामा</span><br/>
<br/>
मुरली भित्र हवाको स्पन्दन<br/>
वादक प्रतिको मृदु अनुकम्पन<br/>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 3em;">समय सरी यमुनामा</span>
</p>
</div>
<p> <span/>
</p>
<div class="poem">
<p><span style="display:inline-block; text-align:center; width:100% ;">(२)</span><br/>
शब्द उडीकन हुन्छ सितार,<br/>
बज्दछ प्रत्युतरको तार<br/>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 3em;">स्पर्श विचित्र ! प्रभात ! !</span><br/>
<br/>
सुती रहेको कुन झन्कार<br/>
पाई झंझनि बज्दछ संसार !<br/>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 3em;">अनुनादित सहभाव !</span>
</p>
</div>
</div>
</div>
